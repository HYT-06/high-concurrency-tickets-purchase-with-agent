server:
  port: 9091

spring:
  application:
    name: monitor-agent
  data:
    redis:
      # Redis 哨兵模式：1 主(6379) + 2 从(6380/6381) + 3 哨兵(26379-26381)
      # 哨兵模式下不能再配 host/port，否则配置冲突。
      # 监控数据（monitor:*）由网关写入，本模块只读；
      # 故障转移期间可能短暂读取失败，读操作本身可容忍。
      sentinel:
        master: mymaster
        nodes: localhost:26379,localhost:26380,localhost:26381

# LangChain4j 双模型配置
# 主 Agent 用 qwen-plus（强推理），子 Agent 用 qwen-turbo（低成本）
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: REDACTED_API_KEY
      model-name: qwen-plus
      temperature: 0.3
      max-tokens: 1024

# 监控 Agent 专用配置
monitor:
  # gateway 监控接口地址
  gateway-url: http://localhost:10010
  # 主 Agent 模型（高级，负责路由+汇总）
  orchestrator-model: qwen-plus
  # 子 Agent 模型（低成本，负责窄域分析）
  sub-agent-model: qwen-turbo
  # 子 Agent 超时秒数
  sub-agent-timeout-seconds: 30

logging:
  level:
    '[dev.langchain4j]': DEBUG
    '[com.example.hyt.monitor]': DEBUG
