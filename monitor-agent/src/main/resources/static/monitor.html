<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12306 监控系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #00d4ff; }
        .container { max-width: 800px; margin: 0 auto; }
        .quick-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .quick-buttons button { padding: 8px 16px; border: 1px solid #00d4ff; background: transparent; color: #00d4ff; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .quick-buttons button:hover { background: #00d4ff; color: #1a1a2e; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        #question { flex: 1; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #16213e; color: #e0e0e0; font-size: 15px; }
        #send { padding: 12px 28px; border: none; border-radius: 8px; background: #00d4ff; color: #1a1a2e; font-weight: bold; cursor: pointer; font-size: 15px; }
        #send:hover { background: #00b4d8; }
        #send:disabled { background: #555; cursor: not-allowed; }
        #response { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 20px; min-height: 200px; white-space: pre-wrap; line-height: 1.6; }
        #response .placeholder { color: #666; }
        .loading { color: #ffcc00; }
        .error { color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 12306 多 Agent 监控系统</h1>
        <div class="quick-buttons">
            <button onclick="ask('最近60秒系统正常吗')">系统整体</button>
            <button onclick="ask('最近60秒流量怎么样')">流量查询</button>
            <button onclick="ask('有人在刷接口吗')">安全检测</button>
            <button onclick="ask('服务还活着吗')">服务健康</button>
            <button onclick="ask('最近5分钟有哪些异常用户')">异常用户</button>
        </div>
        <div class="input-row">
            <input id="question" type="text" placeholder="输入你的监控问题..." onkeypress="if(event.key==='Enter') send()">
            <button id="send" onclick="send()">查询</button>
        </div>
        <div id="response"><span class="placeholder">点击上方按钮或输入问题开始查询...</span></div>
    </div>
    <script>
        const baseUrl = window.location.origin;
        const respDiv = document.getElementById('response');
        const sendBtn = document.getElementById('send');
        const input = document.getElementById('question');

        function ask(question) {
            input.value = question;
            send();
        }

        async function send() {
            const question = input.value.trim();
            if (!question) return;
            sendBtn.disabled = true;
            respDiv.innerHTML = '<span class="loading">⏳ 正在查询，多 Agent 协作中...</span>';
            try {
                const res = await fetch(baseUrl + '/monitor/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await res.json();
                if (data.success) {
                    respDiv.textContent = data.reply;
                } else {
                    respDiv.innerHTML = '<span class="error">❌ ' + (data.error || '查询失败') + '</span>';
                }
            } catch (e) {
                respDiv.innerHTML = '<span class="error">❌ 请求失败: ' + e.message + '</span>';
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
