server:
  port: 10010

spring:
  application:
    name: gateway
  # 默认激活 local profile：JWT 密钥放 application-local.yml（已被 .gitignore 忽略）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      # Redis 哨兵模式：1 主(6379) + 2 从(6380/6381) + 3 哨兵(26379-26381)
      # 哨兵模式下不能再配 host/port，否则配置冲突。
      # 流量采集（TrafficMetricsFilter）写入的 key 会随故障转移自动路由到新主节点。
      sentinel:
        master: mymaster
        nodes: localhost:26379,localhost:26380,localhost:26381
      timeout: 3000ms
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: agent-gateway
              uri: http://localhost:9090
              predicates:
                - Path=/chat/**
            - id: monitor-agent-gateway
              uri: http://localhost:9091
              predicates:
                - Path=/monitor/ask/**
            - id: demo-gateway
              uri: http://localhost:8080
              predicates:
                - Path=/**

# JWT 签名密钥（网关与 demo 必须一致，否则 demo 签发的 token 网关验不过）
# 密钥不入库：本地值放 application-local.yml（gitignore），生产用环境变量 JWT_SECRET 注入
jwt:
  secret: ${JWT_SECRET:}

# 监控配置
monitor:
  # 流量采集过滤器开关
  traffic-enabled: true
  # Redis key 前缀
  key-prefix: "monitor"
  # 数据保留秒数（默认5分钟）
  retention-seconds: 300
