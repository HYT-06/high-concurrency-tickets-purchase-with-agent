server:
  port: 10010

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: agent-gateway
              uri: http://localhost:9090
              predicates:
                - Path=/chat/**
            - id: demo-gateway
              uri: http://localhost:8080
              predicates:
                - Path=/**

# 监控配置
monitor:
  # 流量采集过滤器开关
  traffic-enabled: true
  # Redis key 前缀
  key-prefix: "monitor"
  # 数据保留秒数（默认5分钟）
  retention-seconds: 300
