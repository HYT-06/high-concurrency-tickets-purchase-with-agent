<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座位选择 - 票务预订系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .seat-legend { display: flex; gap: 20px; margin-bottom: 16px; font-size: 13px; align-items: center; }
        .seat-legend span { display: flex; align-items: center; gap: 6px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 4px; }
        .legend-dot.green { background: rgba(68,255,68,0.3); border: 1px solid rgba(68,255,68,0.5); }
        .legend-dot.red { background: rgba(255,68,68,0.2); border: 1px solid rgba(255,68,68,0.4); }
        .legend-dot.accent { background: rgba(233,69,96,0.3); border: 2px solid #e94560; }
        .btn-book { width: 100%; margin-top: 20px; padding: 14px; font-size: 16px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="logo">票务预订系统</span>
        <div class="user-info">
            <a href="/trains.html">车次查询</a>
            <a href="/orders.html">我的订单</a>
            <span id="welcomeText">欢迎</span>
            <a href="/login.html" onclick="sessionStorage.clear()">退出登录</a>
        </div>
    </nav>

    <div class="container">
        <div class="breadcrumb">
            <a href="/trains.html">车次列表</a> / <span id="trainNameBreadcrumb">座位详情</span>
        </div>

        <div class="card">
            <h2 id="trainTitle">座位选择</h2>
            <div class="seat-legend">
                <span><span class="legend-dot green"></span> 可选</span>
                <span><span class="legend-dot red"></span> 已售</span>
                <span><span class="legend-dot accent"></span> 已选</span>
            </div>

            <div class="seat-grid" id="seatGrid">
                <div class="loading"><div class="spinner"></div>加载座位...</div>
            </div>

            <div class="msg-box" id="msgBox"></div>
            <button class="btn btn-book" id="bookBtn" disabled onclick="bookSeat()">请选择座位</button>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/seats.js"></script>
    <link rel="stylesheet" href="/css/chat-widget.css">
    <script src="/js/chat-widget.js"></script>
</body>
</html>
