<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 票务预订系统</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .register-box { max-width: 460px; margin: 40px auto; }
        .register-box .card h1 { text-align: center; font-size: 24px; margin-bottom: 4px; }
        .register-box .card > p { text-align: center; font-size: 13px; color: #6a6a7a; margin-bottom: 24px; }
        .btn-block { width: 100%; padding: 12px; font-size: 15px; text-align: center; }
        .footer-text { text-align: center; margin-top: 16px; font-size: 13px; color: #6a6a7a; }
        .footer-text a { color: #e94560; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="card">
                <h1>票务预订系统</h1>
                <p>创建您的账户</p>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="userName">用户名</label>
                        <input type="text" id="userName" placeholder="请输入用户名" autocomplete="username" maxlength="50">
                        <div class="error-msg" id="userNameError">请输入用户名</div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" placeholder="请输入密码" autocomplete="new-password">
                        <div class="error-msg" id="pwdError">密码至少6位</div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPwd">确认密码</label>
                        <input type="password" id="confirmPwd" placeholder="再次输入密码" autocomplete="new-password">
                        <div class="error-msg" id="confirmError">两次密码不一致</div>
                    </div>

                    <div class="form-group">
                        <label for="phone">手机号</label>
                        <input type="text" id="phone" placeholder="请输入手机号" maxlength="15">
                        <div class="error-msg" id="phoneError">请输入有效手机号</div>
                    </div>

                    <div class="form-group">
                        <label for="address">地址</label>
                        <input type="text" id="address" placeholder="请输入地址（选填）" maxlength="200">
                    </div>

                    <button type="submit" class="btn btn-block" id="submitBtn">注 册</button>

                    <div class="msg-box" id="msgBox"></div>
                </form>

                <p class="footer-text">已有账户？<a href="/login.html">返回登录</a></p>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
