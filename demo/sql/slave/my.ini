# ============================================================
# MySQL 从库实例配置（本地开发用）
# 启动：mysqld --defaults-file="<本文件路径>"
# 主库：3306（server-id=1）  从库：3307（server-id=2）
# 注意：datadir 需为独立目录，不能与主库共用
# ============================================================
[mysqld]
basedir=C:/Program Files/MySQL/MySQL Server 8.0
datadir=G:/JAVA/mysql-slave-data
port=3307

# 复制相关：server-id 必须与主库(1)不同，否则复制线程会直接报错退出
server-id=2
log-bin=slave-bin
relay-log=slave-relay-bin

# 从库只读，防止误写造成主从数据分叉
# read_only 仅限制普通用户，SUPER 权限账号（如 root）仍可写入，便于首次导入数据
read_only=1

# 与主库保持一致，避免 SQL 线程回放出错
binlog_format=ROW
gtid_mode=OFF

# 【注意】原计划用 min-replicas-to-write / min-replicas-max-lag 做「写法定人数」保护
# （主库在从库滞后时拒绝写入，可避免故障转移丢数据导致超卖）。
# 但 MySQL 8.0.43 已移除这两个变量，实测配置后会直接启动失败：
#   [ERROR] [MY-000067] unknown variable 'min-replicas-to-write=1'
# 因此当前版本下无法用配置规避该风险，需要应用层保证（见交付说明）。
