# ============================================================
# Redis 节点配置（从节点 → 可被提升为主节点）
# 启动：redis-server.exe slave-6380.conf
#
# 【说明】哨兵在故障转移时会用 CONFIG REWRITE 重写本文件
# （移除 slaveof、加上 dir 引号等），属正常现象。
# 本文件作为可复现的模板保留在版本库中。
# ============================================================
port 6380
dir G:/JAVA/redis-sentinel/data-6380
logfile G:/JAVA/redis-sentinel/redis-6380.log

# 指向主节点（Redis 3.0 用 slaveof，5.0 起才叫 replicaof）
slaveof 127.0.0.1 6379
slave-read-only yes

save ""
appendonly no

# ---------- 写法定人数保护 ----------
# 至少 1 个从库确认且延迟不超过 10 秒，否则主节点拒绝写入。
# 作用：避免故障转移时丢掉尚未同步的库存扣减，
#       否则新主节点会"回滚"库存，把已售座位重新放出（超卖）。
#
# 【重要】CONFIG SET 修改不会随复制传播——实测故障转移后新主节点上
#        该值会变回 0。所以必须写进每个节点的配置文件，
#        保证任意节点被提升为主时都自带保护。
min-slaves-to-write 1
min-slaves-max-lag 10
