# ============================================================
# 哨兵 1 / 3  端口 26379
# 启动：redis-server.exe sentinel-26379.conf --sentinel
# 说明：sentinel monitor 末尾的 2 是 quorum（判定客观下线的票数），
#       三个哨兵取 2 即可；哨兵数量必须为奇数且 >= 3。
#       本文件会被哨兵自动重写（记录 myid / 已知哨兵列表等），属正常现象。
# ============================================================
port 26379
dir "G:\\JAVA\\redis-sentinel"
logfile "G:/JAVA/redis-sentinel/sentinel-26379.log"

sentinel monitor mymaster 127.0.0.1 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000
sentinel config-epoch mymaster 0
# Generated by CONFIG REWRITE
sentinel leader-epoch mymaster 0
sentinel known-slave mymaster 127.0.0.1 6380
sentinel known-slave mymaster 127.0.0.1 6381
sentinel known-sentinel mymaster 127.0.0.1 26381 dc510f722ecb6e6797b7c11bb12c6ea65cbb4e7b
sentinel known-sentinel mymaster 127.0.0.1 26380 29fef04b827c4f2876ce91227370c455a82f1159
sentinel current-epoch 0
