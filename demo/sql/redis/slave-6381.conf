# ============================================================
# Redis 节点配置（从节点 → 可被提升为主节点）
# 启动：redis-server.exe slave-6381.conf
# 说明见 slave-6380.conf
# ============================================================
port 6381
dir G:/JAVA/redis-sentinel/data-6381
logfile G:/JAVA/redis-sentinel/redis-6381.log

slaveof 127.0.0.1 6379
slave-read-only yes

save ""
appendonly no

# 写法定人数保护，理由见 slave-6380.conf
min-slaves-to-write 1
min-slaves-max-lag 10
